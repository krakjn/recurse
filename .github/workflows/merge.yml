name: Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  bump:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN is not enough to trigger the tag pipeline on ci.yml
          token: ${{ secrets.RECURSE_TOKEN }}

      - uses: krakjn/bump@v9

      - name: bump and tag
        env:
          # main tip before merge; diff to HEAD is what the PR landed
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bump patch --if-changed-from "$BASE"
          ver=$(bump print --semver --only base)
          python3 - "$ver" <<'PY'
          import pathlib, re, sys
          ver = sys.argv[1]
          path = pathlib.Path("build.zig.zon")
          text = path.read_text()
          new, n = re.subn(r'(\.version = ")[^"]+(")', rf'\g<1>{ver}\2', text, count=1)
          if n != 1:
              raise SystemExit("build.zig.zon version field missing")
          path.write_text(new)
          PY
          git add -u
          git diff --cached --quiet && exit 0
          git config user.name "recurse-ci"
          git config user.email "recurse-ci@users.noreply.github.com"
          git commit -m "chore: bump to $(bump print)"
          bump tag
          git push origin main --follow-tags
