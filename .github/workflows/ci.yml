name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-24.04
            artifact: recurse-x86_64-linux
            extra_args: ""
          - name: aarch64-linux
            os: ubuntu-24.04-arm
            artifact: recurse-aarch64-linux
            extra_args: ""
          - name: x86_64-linux-musl
            os: ubuntu-24.04
            artifact: recurse-x86_64-linux-musl
            extra_args: "-Dtarget=x86_64-linux-musl -Dssh=false"
          - name: aarch64-macos
            os: macos-26
            artifact: recurse-aarch64-macos
            extra_args: ""
          - name: x86_64-macos
            os: macos-15-intel
            artifact: recurse-x86_64-macos
            extra_args: ""
          - name: x86_64-windows
            os: windows-latest
            artifact: recurse-x86_64-windows
            extra_args: "-Dssh=false"

    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          version=0.17.0
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) target=x86_64-linux; ext=tar.xz; sum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
            Linux-ARM64) target=aarch64-linux; ext=tar.xz; sum=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
            macOS-ARM64) target=aarch64-macos; ext=tar.xz; sum=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a ;;
            macOS-X64) target=x86_64-macos; ext=tar.xz; sum=4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6 ;;
            Windows-X64) target=x86_64-windows; ext=zip; sum=b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428 ;;
            *) echo "unsupported runner ${{ runner.os }} ${{ runner.arch }}" >&2; exit 1 ;;
          esac
          if command -v cygpath >/dev/null 2>&1; then
            tmp=$(cygpath -u "$RUNNER_TEMP")
          else
            tmp=$RUNNER_TEMP
          fi
          file="zig-${target}-${version}.${ext}"
          curl -fsSL -o "$tmp/$file" "https://ziglang.org/download/${version}/${file}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${sum}  ${file}" | (cd "$tmp" && sha256sum -c -)
          else
            echo "${sum}  ${file}" | (cd "$tmp" && shasum -a 256 -c -)
          fi
          tar -xf "$tmp/$file" -C "$tmp"
          bindir="$tmp/zig-${target}-${version}"
          if [ -x "$bindir/zig.exe" ]; then
            "$bindir/zig.exe" version
          else
            "$bindir/zig" version
          fi
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "$bindir" >> "$GITHUB_PATH"
          else
            echo "$bindir" >> "$GITHUB_PATH"
          fi

      - name: Install libssh2
        if: runner.os == 'Linux' && !contains(matrix.extra_args, '-Dssh=false')
        run: sudo apt-get update && sudo apt-get install -y libssh2-1-dev pkg-config

      - name: Install libssh2
        if: runner.os == 'macOS'
        run: brew install libssh2

      - name: Test
        if: matrix.extra_args == ''
        run: zig build test --summary all

      - name: Build
        run: zig build -Doptimize=safe ${{ matrix.extra_args }} --summary all

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          bin=zig-out/bin/recurse
          cp "$bin" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          (cd dist && tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}")
          rm "dist/${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp zig-out/bin/recurse.exe dist/${{ matrix.artifact }}.exe
          (cd dist && 7z a -tzip ${{ matrix.artifact }}.zip ${{ matrix.artifact }}.exe)
          rm dist/${{ matrix.artifact }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
